name: SonarQube Analysis # Nome mais descritivo para o workflow
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build, Test and Analyze # Nome mais descritivo para o job
    runs-on: windows-latest # Mantendo o runner Windows como você configurou

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: zulu

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Desabilitar shallow clones é recomendado para SonarQube

      # Removendo o cache do SonarScanner. O `dotnet tool install --global` é rápido o suficiente
      # e evita problemas com versões cacheadas ou caminhos.

      - name: Install .NET SDK # Adicionando a instalação do SDK .NET explicitamente
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x' # Garanta que esta versão corresponda ao seu projeto (ex: 6.0.x, 7.0.x, 8.0.x)

      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner --version 5.14.0 # Ou a versão estável mais recente

      - name: Build, Test and Analyze with SonarQube
        shell: powershell
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }} # Assumindo que este também é um secret
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}   # Assumindo que este também é um secret
        run: |
          # Inicia a análise do SonarScanner - Tudo em uma única linha lógica para evitar erros de parsing do PowerShell
          dotnet sonarscanner begin /k:"$env:SONAR_PROJECT_KEY" /o:"$env:SONAR_ORGANIZATION" /d:sonar.token="$env:SONAR_TOKEN" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" /d:sonar.coverage.exclusions="**/Program.cs,**/*Extensions*.cs,**/Migrations/**"

          # Constrói o projeto
          dotnet build --no-incremental

          # Executa os testes e coleta a cobertura
          dotnet test `
            --no-build `
            /p:CollectCoverage=true `
            /p:CoverletOutputFormat=opencover `
            /p:CoverletOutput=./coverage.opencover.xml `
            --results-directory TestResults/ # Boa prática para organizar os resultados dos testes

          # Finaliza a análise do SonarScanner
          dotnet sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"
          